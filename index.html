<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本金玉統一教会 信者専用掲示板</title>
    <style>
        body {font-family: 'MS Gothic', Arial, sans-serif; background: linear-gradient(#000033, #330033); color: #ffcc00; margin:0; padding:0;}
        header {background: #990000; padding:15px; text-align:center; border-bottom:6px solid #ffcc00;}
        .main-image {max-width:100%; height:auto; border:8px solid #ffd700; box-shadow:0 0 30px rgba(255,215,0,0.8); margin-bottom:10px;}
        h1 {margin:10px 0 5px 0; font-size:2.6em; text-shadow:0 0 15px #ffff00;}
        .container {max-width:900px; margin:20px auto; padding:10px;}
        .post-form {background:rgba(0,0,0,0.85); border:3px solid #ffcc00; padding:20px; margin-bottom:30px;}
        input, textarea {width:100%; padding:12px; margin:8px 0; background:#111122; color:#ffdd88; border:2px solid #990000; font-size:16px;}
        button {background:#990000; color:#ffcc00; padding:12px 40px; font-size:1.1em; border:none; cursor:pointer; margin-top:10px;}
        button:hover {background:#ff0000; color:white;}
        .posts {background:rgba(0,0,0,0.7); border:3px solid #ffcc00; padding:15px;}
        .post {background:rgba(40,0,0,0.8); margin:15px 0; padding:15px; border-left:5px solid #ffcc00;}
        .post-header {color:#ffff88; font-size:0.95em; margin-bottom:8px;}
        .name {font-weight:bold; color:#ffeeee;}
        footer {text-align:center; padding:40px 10px; color:#666; font-size:0.9em;}
    </style>
</head>
<body>
    <header>
        <h1>日本金玉統一教会</h1>
    </header>

    <div class="container">
        <div class="post-form">
            <h2>信者の声を書く</h2>
            <input type="text" id="name" placeholder="信者名" value="無名信者">
            <textarea id="message" rows="5" placeholder="たけ様への感謝・お言葉・証しなど..."></textarea>
            <button onclick="postMessage()">投稿する</button>
        </div>

        <h2>● 信者の声</h2>
        <div class="posts" id="postList"></div>
    </div>

    <footer>日本金玉統一教会 信者専用掲示板</footer>

    <script>
        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem('kingyamaPosts')) || [];
            const list = document.getElementById('postList');
            list.innerHTML = posts.length === 0 ? '<p style="text-align:center;color:#888;padding:40px;">まだ書き込みがありません。</p>' : '';
            posts.reverse().forEach(p => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `<div class="post-header"><span class="name">${p.name}</span>　　${p.time}</div><div>${p.message}</div>`;
                list.appendChild(div);
            });
        }

        function postMessage() {
            const name = document.getElementById('name').value.trim() || '無名信者';
            const msg = document.getElementById('message').value.trim();
            if (!msg) return alert("本文を入力してください。");

            const posts = JSON.parse(localStorage.getItem('kingyamaPosts')) || [];
            posts.push({name, message: msg, time: new Date().toLocaleString('ja-JP')});
            localStorage.setItem('kingyamaPosts', JSON.stringify(posts));

            document.getElementById('message').value = '';
            loadPosts();
        }

        window.onload = loadPosts;
    </script>
</body>
</html>
